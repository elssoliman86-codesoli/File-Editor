name: midad
description: Offline-first Arabic document workspace for DOCX, PDF and TXT.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.14.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Variable.ttf
        - asset: assets/fonts/NotoNaskhArabic-Variable.ttf
          weight: 700

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  arabic_text:
    path: packages/arabic_text
  document_core:
    path: packages/document_core
  docx_engine:
    path: packages/docx_engine
  txt_engine:
    path: packages/txt_engine
  archive: 4.7.1
  crypto: 3.0.8
  dart_quill_delta: 10.0.0
  enough_convert: 1.7.1
  file_picker: 13.4.0
  flutter_quill: 11.6.0
  flutter_riverpod: 3.5.0
  go_router: 18.1.4
  image_picker: 1.2.4
  intl: 0.20.2
  image: 4.13.1
  mime: 2.1.0
  path: 1.9.1
  path_provider: 2.1.6
  pdf: 3.13.1
  pdfrx: 3.1.0
  printing: 5.15.1
  share_plus: 13.3.1
  shared_preferences: 2.5.6
  sqflite: 2.4.6
  xml: 7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  integration_test:
    sdk: flutter
