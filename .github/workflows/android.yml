name: analyze-test-apk

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: midad-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - name: Restore OFL font assets
        run: bash tools/fetch_fonts.sh
      - name: Resolve dependencies (app and local packages)
        run: |
          mkdir -p build/logs
          set -o pipefail
          # Non-verbose output keeps pub's human-readable "version solving failed"
          # explanation, which the verbose log buries under a stack trace.
          flutter pub get 2>&1 | tee build/logs/pub-get.log
          for package in arabic_text document_core docx_engine txt_engine; do
            (cd "packages/$package" && dart pub get 2>&1 | tee "../../build/logs/pub-get-$package.log")
          done
      - name: Upload dependency failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-${{ github.run_number }}
          path: build/logs/
          retention-days: 14
      - name: Auto-format (TEMPORARY, removed once the tree is formatted)
        if: github.ref == 'refs/heads/fix/apk-build-root-cause'
        run: |
          dart format .
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "style: apply dart format"
            git push origin HEAD:fix/apk-build-root-cause
          fi
      - name: Format check
        run: dart format --output=none --set-exit-if-changed .
      - name: Static analysis
        run: flutter analyze --no-fatal-infos
      - name: Unit and widget tests
        run: flutter test --coverage
      - name: Package tests (pure Dart)
        run: |
          for package in arabic_text document_core docx_engine txt_engine; do
            if [ -d "packages/$package/test" ]; then
              (cd "packages/$package" && dart test)
            else
              echo "::warning title=No tests::packages/$package has no test/ directory"
            fi
          done
      # Release (AOT, minified) builds. Debug builds run in the JIT with
      # assertions on and are several times slower on a phone, which is what made
      # the app hang. Signing: the committed evaluation key unless MIDAD_KEYSTORE_*
      # secrets are provided (see docs/BUILD.md).
      - name: Prepare private signing key (only when secrets exist)
        env:
          KEYSTORE_B64: ${{ secrets.MIDAD_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/midad-release.jks"
            echo "MIDAD_KEYSTORE_FILE=$RUNNER_TEMP/midad-release.jks" >> "$GITHUB_ENV"
            echo "MIDAD_KEYSTORE_PASSWORD=${{ secrets.MIDAD_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "MIDAD_KEY_ALIAS=${{ secrets.MIDAD_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "MIDAD_KEY_PASSWORD=${{ secrets.MIDAD_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            echo "No private keystore secret; using the committed evaluation key."
          fi
      - name: Build universal release APK
        run: flutter build apk --release
      - name: Build ABI release APKs
        run: flutter build apk --release --split-per-abi
      - name: Verify APK signatures
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          echo "Using $APKSIGNER"
          for apk in build/app/outputs/flutter-apk/*.apk; do
            "$APKSIGNER" verify --verbose "$apk" | head -n 3
          done
          sha256sum build/app/outputs/flutter-apk/*.apk > build/app/outputs/flutter-apk/SHA256SUMS.txt
          ls -lh build/app/outputs/flutter-apk/
      - uses: actions/upload-artifact@v4
        with:
          name: midad-apk-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/flutter-apk/SHA256SUMS.txt
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: test-evidence-${{ github.sha }}
          path: coverage/lcov.info
          retention-days: 30

  emulator-smoke:
    needs: verify-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: midad-apk-*
          path: artifacts
          merge-multiple: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and exercise the release APK on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          script: bash tools/smoke_test.sh artifacts/app-x86_64-release.apk

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: verify-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: midad-apk-*
          path: artifacts
          merge-multiple: true
      - name: Name the files for download
        run: |
          mkdir -p dist
          for f in artifacts/*.apk; do
            case "$f" in
              */app-release.apk) kind=universal ;;
              */app-arm64-v8a-release.apk) kind=arm64-v8a ;;
              */app-armeabi-v7a-release.apk) kind=armeabi-v7a ;;
              */app-x86_64-release.apk) kind=x86_64 ;;
              *) continue ;;
            esac
            cp "$f" "dist/Midad-${GITHUB_REF_NAME}-${kind}.apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -lh dist
      - uses: softprops/action-gh-release@v2
        with:
          name: Midad ${{ github.ref_name }}
          body: |
            ## تحميل التطبيق / Download

            - **أغلب الهواتف الحديثة / most modern phones:** `Midad-${{ github.ref_name }}-arm64-v8a.apk`
            - **أي جهاز / any device:** `Midad-${{ github.ref_name }}-universal.apk` (أكبر حجماً / larger)

            هذه نسخة **Release** سريعة (AOT) وليست نسخة تطوير. موقّعة بمفتاح تقييم ثابت، فيمكن تحديثها فوق النسخة السابقة مباشرة.
            This is an optimised **release** build (not a debug build), signed with a stable evaluation key so it installs over the previous release.

            Built by GitHub Actions after format, static analysis and tests. `SHA256SUMS.txt` lists the checksums.
          files: dist/*
          make_latest: true
