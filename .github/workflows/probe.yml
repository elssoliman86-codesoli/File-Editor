name: probe-api
on:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - name: Probe packages
        run: |
          bash tools/fetch_fonts.sh
          flutter pub get > /dev/null
          flutter pub add flutter_markdown_plus markdown > /dev/null 2>&1 || true
          c=$HOME/.pub-cache/hosted/pub.dev
          V=$c/pdfrx-3.1.0/lib/src/widgets
          E=$c/pdfrx_engine-0.9.6/lib/src
          M=$c/flutter_markdown_plus-1.0.12/lib/src
          echo "=== params flags"; grep -nE "panEnabled|scaleEnabled|enableTextSelection|textSelectionParams|interactionEndFrictionCoefficient|minScale|maxScale|boundaryMargin|PdfPageOverlaysBuilder =|PdfViewerOverlaysBuilder =" $V/pdf_viewer_params.dart | cut -c1-200 | head -30
          echo "=== pageOverlaysBuilder doc"; sed -n 505,548p $V/pdf_viewer_params.dart
          echo "=== gesture notes"; sed -n 6930,6965p $V/pdf_viewer.dart; sed -n 7068,7100p $V/pdf_viewer.dart
          echo "=== PdfPage"; grep -nE "^\s+(final|double|int|Future|bool|PdfPageRotation|Size|Rect|abstract|class|static)[^;{]*(width|height|rotation|pageNumber|render|document|size|get )" $E/pdf_page.dart | cut -c1-180 | head -30
          echo "=== PdfDocument"; grep -nE "createNew|createFromJpegData|set pages|encodePdf|static Future<PdfDocument> open|bool get isEncrypted|dispose\(" $E/pdf_document.dart | cut -c1-200
          sed -n '/static Future<PdfDocument> createFromJpegData/,/;/p' $E/pdf_document.dart | head -20
          echo "=== viewer controller"; grep -nE "^\s+(Future|bool|PdfDocument|int|Matrix4|double|Rect)[^=]*(useDocument|get document|get isReady|goToPage|get pageNumber|get currentPageNumber|get documentSize|getPageRect|zoom)" $V/pdf_viewer.dart | cut -c1-180 | head -25
          echo "=== MarkdownWidget ctor"; sed -n '/^abstract class MarkdownWidget/,/^  });/p' $M/widget.dart | grep -E "^\s+(this|required this)\.|const MarkdownWidget" | cut -c1-120
          sed -n '/^class MarkdownBody/,/^  });/p' $M/widget.dart | head -50
          echo "=== MarkdownStyleSheet"; grep -nE "^  (factory|MarkdownStyleSheet)" $M/style_sheet.dart | cut -c1-160
          ls $M
