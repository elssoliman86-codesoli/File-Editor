name: probe-api
on:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - name: Probe packages
        run: |
          bash tools/fetch_fonts.sh
          flutter pub get > /dev/null
          flutter pub add flutter_markdown_plus markdown > /dev/null 2>&1 || true
          c=$HOME/.pub-cache/hosted/pub.dev
          V=$c/pdfrx-3.1.0/lib/src/widgets
          E=$c/pdfrx_engine-0.9.6/lib/src
          M=$c/flutter_markdown_plus-1.0.12/lib/src
          P=$c/pdfrx-3.1.0/lib/src
          echo "=== pdfrx_flutter.dart"; sed -n 40,175p $P/pdfrx_flutter.dart
          echo "=== pdf_page.dart render"; sed -n 55,110p $E/pdf_page.dart
          echo "=== pdf_image.dart"; sed -n 1,60p $E/pdf_image.dart
          echo "=== md export"; cat $c/flutter_markdown_plus-1.0.12/lib/flutter_markdown_plus.dart | grep -v "^//"
          grep -n "factory MarkdownStyleSheet\|MarkdownStyleSheet copyWith\|textScaler\|textScaleFactor" $c/flutter_markdown_plus-1.0.12/lib/src/style_sheet.dart | head
          echo "=== PdfTextSelectionParams"; grep -rn "class PdfTextSelectionParams" -A12 $V | head -30
